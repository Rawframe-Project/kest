# Publishes the site: the playground (the command line built as WebAssembly
# with the page around it, held to the machine by check-wasm.sh first) at the
# root, and the documentation, the standard library reference, llms.txt and
# llms-full.txt that tools/build_site.py writes. Built in the CI image, which
# has the WebAssembly toolchain, Node and the markdown package.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The playground, held to the machine
        run: |
          cmake --preset linux-clang
          cmake --build --preset linux-clang
          KEST_BUILD=out/linux-clang sh tools/check-wasm.sh
      - name: The site
        run: |
          KEST_BUILD=out/linux-clang python3 tools/build_site.py
          cp -r out/linux-clang/playground/. _site/
          test -f _site/index.html && test -f _site/llms.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
