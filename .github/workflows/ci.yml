# Continuous integration: the pull request check, and the full check on main
# and every night, which fuzzes longer. Each build cell is a CMake preset built
# and tested by the organization's shared workflow, which runs the preset's
# ctest tests; the other jobs are what no preset holds. docs/operations/checks.md
# explains each job; `required` is the one check the ruleset asks for.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 0 * * *"
  # A dispatch runs the night's checks, its fuzzing included.
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds the libFuzzer target runs (the night's run is 600)
        type: number
        default: 600

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  # docs/user is not documentation only here: tools/check_guide.py runs every
  # program on those pages.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@bf59dbcd696369b51a9831145fb3b60f3bc71280 # v0.0.26
    permissions:
      pull-requests: read
    with:
      docs: '^(docs/(internals|operations)/|docs/README\.md$|\.github/ISSUE_TEMPLATE/)|^[A-Z]+\.md$'

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@bf59dbcd696369b51a9831145fb3b60f3bc71280 # v0.0.26
    permissions:
      contents: read

  # The documentation site builds: every page, the standard library reference
  # `kest doc` writes, llms.txt and llms-full.txt. In the CI image, which has
  # the markdown package.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The site
        run: |
          cmake --preset linux-clang -DKEST_CHECKED=OFF -DKEST_FUZZ=OFF -DKEST_WASM=OFF
          cmake --build --preset linux-clang --target kest
          KEST_BUILD=out/linux-clang python3 tools/build_site.py

  # The libFuzzer target over the source boundary, through the family's
  # tools/fuzz_target.sh, which prints neither the seed nor a finding's input.
  # A pull request fuzzes a minute from the committed programs alone; the
  # night fuzzes longer from the corpus the nights before kept, minimizes it
  # and saves it from main. Nothing of a corpus or a finding is uploaded.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      NIGHT: ${{ github.event_name != 'pull_request' }}
      SECONDS_EACH: ${{ github.event_name == 'pull_request' && 60 || inputs.fuzz-seconds || 600 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The target
        run: |
          cmake --preset linux-clang
          cmake --build --preset linux-clang --target fuzz-cover
      - if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        run: |
          mkdir -p out/fuzz-corpus/fuzz-cover out/fuzz-seeds
          # The committed programs are the floor of every corpus.
          find examples lib/std test -name '*.kest' -exec cp {} out/fuzz-seeds/ \;
          test -n "$(ls out/fuzz-seeds)"
          # The script prints only that it found something; the kind and the
          # sanitizer's report, never the input, are in its report file.
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh out/linux-clang/tools/fuzz-cover out/fuzz-corpus/fuzz-cover \
            out/fuzz-seeds -max_total_time="$SECONDS_EACH" -rss_limit_mb=4096 \
            -timeout=25 || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      - if: github.event_name != 'pull_request'
        name: Minimize the corpus
        run: |
          mkdir -p out/fuzz-corpus/merged
          out/linux-clang/tools/fuzz-cover -merge=1 out/fuzz-corpus/merged \
            out/fuzz-corpus/fuzz-cover >out/fuzz-merge.log 2>&1
          rm -rf out/fuzz-corpus/fuzz-cover
          mv out/fuzz-corpus/merged out/fuzz-corpus/fuzz-cover
          echo "$(ls out/fuzz-corpus/fuzz-cover | wc -l) input(s) kept"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}

  # Every cell builds with warnings as errors and runs its test preset: the
  # Linux GCC cell the whole gate but what the Linux Clang cell runs, which is
  # the C backend, the doors, WebAssembly and the fuzzers; arm64 the seeded
  # fuzzer and the C backend, where every processor fuses a multiply and an
  # add; every Unix cell the fast tests; and every cell the conformance trace
  # every platform has to print byte for byte.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc }
          - { preset: linux-clang }
          - { preset: linux-arm64, runner: ubuntu-24.04-arm }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-msvc, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@bf59dbcd696369b51a9831145fb3b60f3bc71280 # v0.0.26
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}

  # The release archive on every platform, unpacked into a room of its own and
  # used the way somebody who downloaded it would: the binary asked what it
  # is, a program it has never seen run through it with nothing in the
  # environment, and a host compiled against the header and the library in it.
  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: The archive
        run: |
          cmake --preset release
          cmake --build --preset release
          # CMake's own cpack: Windows runners have a Chocolatey one first on the path.
          "$(dirname "$(command -v cmake)")/cpack" --preset release
      - name: Unpacked and used
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/unpacked"
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -q "$GITHUB_WORKSPACE"/out/release/package/kest-*.zip
          else
            tar xzf "$GITHUB_WORKSPACE"/out/release/package/kest-*.tar.gz
          fi
          cd kest-*
          unpacked=$PWD
          cat VERSION
          (cd "$RUNNER_TEMP/elsewhere" &&
            PATH="$unpacked/bin:$PATH" kest run "$GITHUB_WORKSPACE/examples/math.kest")
          printf '%s\n' '#include "kest.h"' '#include <stdio.h>' \
              'int main(void) {' \
              '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }' \
              '    printf("a host built against the archive says %s, abi %u\\n",' \
              '           kest_version(), kest_abi_version());' \
              '    return 0;' \
              '}' > host.c
          if [ "$RUNNER_OS" = Windows ]; then
            cl /nologo /std:c11 /Iinclude host.c lib/kest.lib /Fe:host.exe
            ./host.exe
          else
            cc -std=c11 -Wall -Wextra -Werror -Iinclude -o host host.c lib/libkest.a -lm
            ./host
          fi

  # An engine hosting Kest: raylib built from its own source, the hosts built
  # against it, and the games played by their own players under a display
  # nobody sees, which have to end where they always end.
  games:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: raylib, and a display nobody sees
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libx11-dev libxrandr-dev \
              libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          git clone -q --depth 1 --branch 5.5 \
              https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
          make -C "$RUNNER_TEMP/raylib/src" PLATFORM=PLATFORM_DESKTOP -j
      - name: The games
        run: |
          cmake --preset dev -DKEST_CHECKED=OFF -DKEST_RAYLIB="$RUNNER_TEMP/raylib/src"
          cmake --build --preset dev --target tetris colony
      - name: Tetris, played by an engine
        run: |
          KEST_LIB=lib/ xvfb-run -a -s "-screen 0 800x700x24" \
              out/dev/examples/tetris/host --frames 1500 --shot tetromino.png | tee said
          grep -q "1500 frame(s), score 3$" said
          test -s tetromino.png
      - name: The colony, its rules run both ways
        run: |
          for native in 0 1; do
            xvfb-run -a -s "-screen 0 1024x768x24" \
                out/dev/examples/colony/colony --frames 600 --native "$native" | tee said
            grep -q "^600 frames: people" said
          done

  # And the same game as something a Windows player unzips and runs: raylib's
  # own build for MSVC, the library and the host compiled with the runtime
  # raylib was built with, and the game's files beside the program. Built
  # rather than played: a hosted Windows runner has no OpenGL 3.3 to open a
  # window with. See D1270.
  tetris-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: raylib as its own release built it for MSVC
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_msvc16.zip -OutFile raylib.zip
          Expand-Archive raylib.zip -DestinationPath raylib-win
      - name: the game, and the zip a player unpacks
        shell: pwsh
        run: |
          $raylib = (Get-ChildItem raylib-win -Directory)[0].FullName
          $sources = Get-ChildItem src\*.c | Where-Object Name -ne 'main.c' |
            ForEach-Object FullName
          cl /nologo /std:c11 /experimental:c11atomics /O2 /MD /Iinclude `
            "/I$raylib\include" /D_CRT_SECURE_NO_WARNINGS `
            '/DKEST_LIB_DIR="lib/kest/"' $sources examples\tetris\host.c `
            /Fe:tetris.exe /link "$raylib\lib\raylib.lib" winmm.lib gdi32.lib `
            user32.lib shell32.lib opengl32.lib
          if ($LASTEXITCODE -ne 0) { throw "the game would not build" }
          $out = 'kest-tetris-windows-x86_64'
          New-Item -ItemType Directory "$out\lib\std", "$out\examples\tetris" | Out-Null
          Copy-Item tetris.exe $out
          Copy-Item lib\std\*.kest "$out\lib\std"
          Copy-Item examples\tetris\game.kest "$out\examples\tetris"
          Copy-Item examples\tetromino.kest "$out\examples"
          Set-Content "$out\README.txt" @(
            'Tetromino, a Tetris clone written in Kest and drawn by raylib.',
            'Run tetris.exe from this folder.',
            '',
            'Left / Right  move        Up / Q  turn',
            'Down          fall faster  Space   drop',
            'P             pause        Esc     quit',
            '',
            'The game is examples\tetromino.kest and examples\tetris\game.kest:',
            'edit them and run it again.')
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kest-tetris-windows-x86_64
          path: kest-tetris-windows-x86_64.zip

  # The one check the ruleset requires: every job above passed, a job the
  # changes job skipped counting as passed.
  required:
    if: always()
    needs: [changes, zizmor, site, fuzz, build, package, games, tetris-windows]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
