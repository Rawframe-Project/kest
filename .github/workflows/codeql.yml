# CodeQL on every pull request and on main. An advanced setup, so the
# analysis builds exactly what the dev preset builds: the library, the command
# line, the example hosts and the instruments.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 8 * * 0"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake --preset dev -DKEST_CHECKED=OFF
          cmake --build --preset dev
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp

  # The analysis saves its trap cache on main keyed by the commit; the entries
  # a newer save replaced are deleted, as ci.yml does for its own.
  prune-caches:
    needs: analyze
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: Rawframe-Project/.github/.github/workflows/cache-prune.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      actions: write
