name: kest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run of this at a time, and a push that arrives while one is going cancels
# it. The whole gate is ten minutes of one runner, so a run of commits stacks
# up behind itself and the newest -- the one anybody is waiting on -- is the
# one that waits longest. What matters is whether `main` is good now.
concurrency:
  group: kest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: bytes it was not written for
        run: make fuzz
      - name: conformance trace
        run: sh tools/conformance.sh ./kest linux-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-linux-x86-64
          path: linux-x86-64.trace
      # The same instrument at the same settings as the arm64 runner below.
      # What is worth comparing between two machines is not a duration -- a
      # hosted runner is somebody else's machine and says so -- but which of
      # the four families moved and by how much against the others on the same
      # box.
      - name: what the four families cost here
        run: |
          make bench/measure bench/frame
          SAMPLES=10 ROUNDS=20000 sh bench/families.sh \
            | tee linux-x86-64.families
      - uses: actions/upload-artifact@v4
        with:
          name: families-linux-x86-64
          path: linux-x86-64.families

  # ARM, on hardware rather than under emulation. C11 and no JIT is a
  # deployment claim and not a performance one, and the only thing that settles
  # what this language costs on another instruction set is running it there.
  # What this job is for is both halves: that a trace taken here is the same
  # bytes as the one taken on x86-64 -- which the `agree` job holds -- and what
  # the four families cost, which nothing here can be argued into.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: bytes it was not written for
        run: make fuzz
      # The C the other backend writes, held to the machine here too: every
      # arm64 has FMA and GCC fuses a multiply and an add by default, which
      # is the build the generated file has to keep two roundings in, and
      # the gate on x86-64 can only ask for with `-mfma`. See D1230.
      - name: the C the other backend writes
        run: sh tools/check-c.sh examples/*.kest
      - name: conformance trace
        run: sh tools/conformance.sh ./kest linux-arm64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-linux-arm64
          path: linux-arm64.trace
      - name: what the four families cost here
        run: |
          make bench/measure bench/frame
          SAMPLES=10 ROUNDS=20000 sh bench/families.sh \
            | tee linux-arm64.families
      - uses: actions/upload-artifact@v4
        with:
          name: families-linux-arm64
          path: linux-arm64.families

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: conformance trace
        run: sh tools/conformance.sh ./kest macos-arm64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-macos-arm64
          path: macos-arm64.trace
      # The same three questions the other two platforms' archives are asked:
      # the binary says what it is, a program it has never seen runs through
      # it, and a host compiles against the header and the library in it.
      # `shasum -a 256` rather than `sha256sum`, which macOS has not got; the
      # Makefile asks which is there. See D1020.
      - name: an archive, unpacked and run
        run: |
          make release
          cd build
          shasum -a 256 -c kest-*.tar.gz.sha256
          mkdir out && tar xzf kest-*.tar.gz -C out
          cd out/kest-*
          export KEST_LIB=lib/kest/
          ./bin/kest --version
          ./bin/kest run "$GITHUB_WORKSPACE/examples/math.kest"
          printf '%s\n' '#include "kest.h"' '#include <stdio.h>' \
              'int main(void) {' \
              '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }' \
              '    printf("a host built against the archive says %s, abi %u\\n",' \
              '           kest_version(), kest_abi_version());' \
              '    return 0;' \
              '}' > host.c
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -o host host.c \
              lib/libkest.a -lm
          ./host
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: build/kest-*.tar.gz*

  # The same tree through a different compiler. Everything else on Linux is
  # gcc, and a warning one compiler makes and the other does not is a thing
  # this tree is held to having none of: `-Werror` is on in every build here,
  # so a clang that sees something gcc does not stops this job. Focused rather
  # than a second copy of the gate -- the build and `make fast` are where a
  # compiler disagreement shows, and the rest of the gate is the same source
  # running the same way. See D1020.
  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build and fast, under clang
        run: |
          clang --version
          make -j CC=clang
          make fast CC=clang

  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: four machines of one build, under the thread sanitiser
        run: |
          make -j kest libkest.a
          cat > /tmp/two.kest <<'KEST'
          module two

          fn work(n: i32) -> i32 no.alloc no.host deterministic {
              let sum = 0
              for i in 0..n {
                  sum += i % 7
              }
              return sum
          }
          KEST
          cat > /tmp/two.c <<'EOF'
          // Four machines of one build, each on a thread of its own. They are
          // started here rather than in the workers: starting writes the
          // build's own stamp counter, so which thread starts a machine is the
          // host's to decide and it is this one. What runs at once is the
          // running. See D988.
          //
          // Through pthreads rather than C11's own, which is what the gate's
          // threads check uses: the thread sanitiser does not see through
          // `thrd_create` and dies in its own interceptor before anything of
          // this language has run. The threads are the harness and not the
          // language, so which of the two makes them is the harness's to pick.
          #include <stdio.h>
          #include <pthread.h>
          #include "kest.h"
          static void *turning(void *given) {
              KestRuntime *rt = given;
              KestValue frame[4] = {{0}};
              frame[0].integer = 200000;
              int32_t at = kest_entry(rt, "work");
              if (at < 0 || !kest_call(rt, at, frame, 4)) {
                  return (void *)1;
              }
              return frame[0].integer == 599994 ? NULL : (void *)1;
          }
          int main(void) {
              KestBuild *build = kest_build("/tmp/two.kest", NULL, stderr,
                                            KEST_FORM_TEXT, 0);
              if (build == NULL) { return 1; }
              KestRuntime *four[4];
              pthread_t running[4];
              for (int i = 0; i < 4; i++) {
                  four[i] = kest_start(build, NULL, NULL);
                  if (four[i] == NULL) {
                      kest_build_report(build, stderr, KEST_FORM_TEXT);
                      return 1;
                  }
              }
              for (int i = 0; i < 4; i++) {
                  if (pthread_create(&running[i], NULL, turning,
                                     four[i]) != 0) {
                      return 1;
                  }
              }
              int wrong = 0;
              for (int i = 0; i < 4; i++) {
                  void *said = NULL;
                  pthread_join(running[i], &said);
                  wrong += said != NULL ? 1 : 0;
              }
              for (int i = 0; i < 4; i++) {
                  kest_runtime_free(four[i]);
              }
              kest_build_free(build);
              if (wrong != 0) {
                  fprintf(stderr, "%d of four did not answer\n", wrong);
                  return 1;
              }
              printf("four machines of one build ran at once and agreed\n");
              return 0;
          }
          EOF
          cc -std=c11 -O1 -g -fsanitize=thread -Iinclude -o /tmp/two /tmp/two.c \
              $(ls src/*.c | grep -v main.c) -lm
          /tmp/two

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: an archive, unpacked and run
        run: |
          make -j
          make release
          cd build
          sha256sum -c kest-*.tar.gz.sha256
          mkdir out && tar xzf kest-*.tar.gz -C out
          cd out/kest-*
          export KEST_LIB=lib/kest/
          ./bin/kest --version
          ./bin/kest run "$GITHUB_WORKSPACE/examples/math.kest"
          # And the way somebody who unpacked it actually runs it: `bin` on
          # the path, nothing installed, nothing in the environment, and
          # standing somewhere that is not the archive. That is what the
          # README says is all it takes, and it was not true until D1128.
          unpacked=$PWD
          (
            cd "$RUNNER_TEMP"
            PATH="$unpacked/bin:$PATH" KEST_LIB= \
              kest run "$GITHUB_WORKSPACE/examples/math.kest"
          )
          # And a host built against the header and the library that are in
          # the archive, which is the question an archive is for. See D1000.
          printf '%s\n' '#include "kest.h"' '#include <stdio.h>' \
              'int main(void) {' \
              '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }' \
              '    printf("a host built against the archive says %s, abi %u\\n",' \
              '           kest_version(), kest_abi_version());' \
              '    return 0;' \
              '}' > host.c
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -o host host.c \
              lib/libkest.a -lm
          ./host
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86-64
          path: build/kest-*.tar.gz*

  # The whole gate, as two halves on five runners at once: everything but the
  # holes on one, and the holes in four shares on four. Together they are
  # `make check`, and apart they answer in a third of the time the one job
  # took. Every job here has a budget, and one that runs past it fails:
  # a gate that takes longer every week is a gate somebody stops waiting for,
  # and the budget is where that is noticed. See D1260.
  most:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # What `check-wasm.sh` builds the library as WebAssembly with: a linker
      # for it and the C library WebAssembly's system interface has, beside
      # the clang and the Node the image has. See D1255.
      - name: a WebAssembly toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lld wasi-libc \
              "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)-dev-wasm32"
      - name: everything but the holes
        run: mkdir -p /home/runner/kest-tmp && TMPDIR=/home/runner/kest-tmp make most

  holes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: a WebAssembly toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lld wasi-libc \
              "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)-dev-wasm32"
      - name: every check put out of order, a share of them
        run: |
          mkdir -p /home/runner/kest-tmp
          KEST_HOLES_SHARE=${{ matrix.share }}/4 \
              TMPDIR=/home/runner/kest-tmp sh tools/check-backstops.sh

  # An engine hosting Kest: raylib built from its own source, the host built
  # against it, and the game played by the program's own player under a
  # display nobody sees, which has to end where it always ends and leave the
  # screen it showed. See D1269.
  tetris:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: raylib, and a display nobody sees
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libx11-dev libxrandr-dev \
              libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          git clone -q --depth 1 --branch 5.5 \
              https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
          make -C "$RUNNER_TEMP/raylib/src" PLATFORM=PLATFORM_DESKTOP -j
      - name: the game, played by an engine
        run: |
          make -j
          make tetris RAYLIB="$RUNNER_TEMP/raylib/src"
          KEST_LIB=lib/ xvfb-run -a -s "-screen 0 800x700x24" \
              examples/tetris/host --frames 1500 --shot tetromino.png | tee said
          grep -q "1500 frame(s), score 3$" said
          test -s tetromino.png
      - uses: actions/upload-artifact@v4
        with:
          name: tetromino-under-raylib
          path: tetromino.png

  # And the same game as something a Windows player unzips and runs: raylib's
  # own build for MSVC, the library and the host compiled with the runtime
  # raylib was built with, and the game's files beside the program. Built
  # rather than played: a hosted Windows runner has no OpenGL 3.3 to open a
  # window with. See D1270.
  tetris-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: raylib as its own release built it for MSVC
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_msvc16.zip -OutFile raylib.zip
          Expand-Archive raylib.zip -DestinationPath raylib-win
      - name: the game, and the zip a player unpacks
        shell: pwsh
        run: |
          $raylib = (Get-ChildItem raylib-win -Directory)[0].FullName
          $sources = Get-ChildItem src\*.c | Where-Object Name -ne 'main.c' |
            ForEach-Object FullName
          cl /nologo /std:c11 /experimental:c11atomics /O2 /MD /Iinclude `
            "/I$raylib\include" /D_CRT_SECURE_NO_WARNINGS `
            '/DKEST_LIB_DIR="lib/kest/"' $sources examples\tetris\host.c `
            /Fe:tetris.exe /link "$raylib\lib\raylib.lib" winmm.lib gdi32.lib `
            user32.lib shell32.lib opengl32.lib
          if ($LASTEXITCODE -ne 0) { throw "the game would not build" }
          $out = 'kest-tetris-windows-x86_64'
          New-Item -ItemType Directory "$out\lib\std", "$out\examples\tetris" | Out-Null
          Copy-Item tetris.exe $out
          Copy-Item lib\std\*.kest "$out\lib\std"
          Copy-Item examples\tetris\game.kest "$out\examples\tetris"
          Copy-Item examples\tetromino.kest "$out\examples"
          Set-Content "$out\README.txt" @(
            'Tetromino, a Tetris clone written in Kest and drawn by raylib.',
            'Run tetris.exe from this folder.',
            '',
            'Left / Right  move        Up / Q  turn',
            'Down          fall faster  Space   drop',
            'P             pause        Esc     quit',
            '',
            'The game is examples\tetromino.kest and examples\tetris\game.kest:',
            'edit them and run it again.')
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kest-tetris-windows-x86_64
          path: kest-tetris-windows-x86_64.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build
        shell: cmd
        run: tools\build.bat
      - name: examples
        shell: bash
        run: |
          export KEST_LIB=lib/
          sh tools/conformance.sh ./build/win/kest.exe windows-x86-64.trace
          cat windows-x86-64.trace
      - name: an archive, unpacked and run
        shell: cmd
        run: tools\package.bat
      # Unpacked into a room of its own and used the way somebody who
      # downloaded it would: the binary asked what it is, a program it has
      # never seen run through it, and a host compiled against the header and
      # the library that are in the archive rather than the ones in this tree.
      # An archive nobody unpacked is a directory listing. See D1000.
      - name: what is in it, from a clean room
        shell: pwsh
        run: |
          $zip = Get-ChildItem build\kest-*-windows-x86_64.zip
          $said = Get-Content "$($zip.FullName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          if (-not $said.StartsWith($hash)) {
            throw "the checksum beside the archive is not the archive's"
          }
          Expand-Archive -Path $zip.FullName -DestinationPath out
          $root = (Get-ChildItem out -Directory)[0].FullName
          $env:KEST_LIB = "$root\lib\kest\"
          & "$root\bin\kest.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the archive's kest.exe would not run" }
          Set-Content hello.kest @(
            'import std.text', '',
            'fn main() -> i32 {',
            '    let said = text.repeat("ok", 2)',
            '    return len(said) - 4',
            '}')
          & "$root\bin\kest.exe" run hello.kest
          if ($LASTEXITCODE -ne 0) { throw "the archive would not run a program" }
          Set-Content host.c @(
            '#include "kest.h"', '#include <stdio.h>',
            'int main(void) {',
            '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }',
            '    printf("a host built against the archive says %s, abi %u\n",',
            '           kest_version(), kest_abi_version());',
            '    return 0;',
            '}')
          cl /nologo /std:c11 /I"$root\include" host.c "$root\lib\kest.lib" /Fe:host.exe
          if ($LASTEXITCODE -ne 0) { throw "a host would not build against the archive" }
          .\host.exe
          if ($LASTEXITCODE -ne 0) { throw "a host built against the archive would not run" }
      - uses: actions/upload-artifact@v4
        with:
          name: trace-windows-x86-64
          path: windows-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86-64
          path: build/kest-*-windows-x86_64.zip*

  agree:
    needs: [linux, linux-arm64, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: trace-*, merge-multiple: true }
      - name: every platform says the same thing
        run: |
          diff -u linux-x86-64.trace windows-x86-64.trace \
            && echo "linux and windows said the same thing"
          diff -u linux-x86-64.trace macos-arm64.trace \
            && echo "linux and macos said the same thing"
          diff -u linux-x86-64.trace linux-arm64.trace \
            && echo "the two instruction sets said the same thing"
