name: release

# A tag `v0.0.2` makes the page a release is: the archive for every platform
# CI builds one on, each with its checksum, and the changelog's section for
# that version as what the page says. It is made as a draft -- the one step
# left is somebody publishing it, which is the step that cannot be taken
# back. `workflow_dispatch` builds the archives and makes no page, which is how
# the pipeline is tried without a tag. See D1265.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: an archive, and the notes for it
        run: |
          make -j
          make release
          cd build
          if command -v sha256sum >/dev/null; then
            sha256sum -c kest-*.tar.gz.sha256
          else
            shasum -a 256 -c kest-*.tar.gz.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            build/kest-*.tar.gz*
            build/kest-*.notes.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # Two steps rather than two lines: a batch file run from cmd without
      # `call` hands control over and never comes back, so the second line of
      # one step is never reached. That is how the first tag made no archive
      # for Windows. See D1265.
      - name: the build
        shell: cmd
        run: tools\build.bat
      - name: an archive
        shell: cmd
        run: tools\package.bat
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/kest-*-windows-x86_64.zip*

  page:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      # The tag says which version it is and the header says which version
      # was built, and a page that disagrees with its archives is refused.
      - name: the tag is the version that was built
        run: |
          built=$(sed -n 's/^#define KEST_VERSION_STRING "\(.*\)"$/\1/p' \
            include/kest.h)
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME and this builds $built"
            exit 1
          fi
          ls out
          test -n "$(ls out/kest-"$built"-*.tar.gz)"
          test -n "$(ls out/kest-"$built"-windows-x86_64.zip)"
      - name: a draft page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=${GITHUB_REF_NAME#v}
          notes=$(ls out/kest-"$built"-linux-x86_64.notes.md)
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Kest $built" --notes-file "$notes" \
            out/kest-"$built"-*.tar.gz out/kest-"$built"-*.tar.gz.sha256 \
            out/kest-"$built"-windows-x86_64.zip \
            out/kest-"$built"-windows-x86_64.zip.sha256
