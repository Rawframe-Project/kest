# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@595e1c52a0fae00e49974c5152a7a6f3ed39753c # v0.0.28
    permissions:
      pull-requests: read
    with:
      scopes: lexer parser checker promises compiler verifier vm heap backend api reload cli fmt lsp debugger doc std examples playground editors bench fuzz build tools
