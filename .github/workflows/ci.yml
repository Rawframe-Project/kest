name: kest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: bytes it was not written for
        run: make fuzz
      - name: conformance trace
        run: sh tools/conformance.sh ./kest linux-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-linux-x86-64
          path: linux-x86-64.trace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: an archive, unpacked and run
        run: |
          make -j
          make release
          cd build
          sha256sum -c kest-*.tar.gz.sha256
          mkdir out && tar xzf kest-*.tar.gz -C out
          cd out/kest-*
          KEST_LIB=lib/kest/ ./bin/kest --version
          KEST_LIB=lib/kest/ ./bin/kest run "$GITHUB_WORKSPACE/examples/math.kest"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86-64
          path: build/kest-*.tar.gz*

  linux-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the whole gate
        run: mkdir -p /home/runner/kest-tmp && TMPDIR=/home/runner/kest-tmp make check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build
        shell: cmd
        run: tools\build.bat
      - name: examples
        shell: bash
        run: |
          export KEST_LIB=lib/
          sh tools/conformance.sh ./build/win/kest.exe windows-x86-64.trace
          cat windows-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-windows-x86-64
          path: windows-x86-64.trace

  agree:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: trace-*, merge-multiple: true }
      - name: the two platforms say the same thing
        run: |
          diff -u linux-x86-64.trace windows-x86-64.trace \
            && echo "both platforms said the same thing"
