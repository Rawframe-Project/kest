# Publishes the site: the playground (the command line built as WebAssembly
# with the page around it, held to the machine by check-wasm.sh first) at the
# root, and the documentation, the standard library reference, llms.txt and
# llms-full.txt that tools/build_site.py writes. Built in the CI image, which
# has the WebAssembly toolchain, Node and the markdown package.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The playground, held to the machine
        run: |
          make -j
          make playground
          sh tools/check-wasm.sh
      - name: The site
        run: |
          python3 tools/build_site.py
          cp -r build/playground/. _site/
          test -f _site/index.html && test -f _site/llms.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
