name: kest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run of this at a time, and a push that arrives while one is going cancels
# it. The whole gate is ten minutes of one runner, so a run of commits stacks
# up behind itself and the newest -- the one anybody is waiting on -- is the
# one that waits longest. What matters is whether `main` is good now.
concurrency:
  group: kest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: bytes it was not written for
        run: make fuzz
      - name: conformance trace
        run: sh tools/conformance.sh ./kest linux-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-linux-x86-64
          path: linux-x86-64.trace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j
      - name: fast
        run: make fast
      - name: conformance trace
        run: sh tools/conformance.sh ./kest macos-arm64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-macos-arm64
          path: macos-arm64.trace
      # The same three questions the other two platforms' archives are asked:
      # the binary says what it is, a program it has never seen runs through
      # it, and a host compiles against the header and the library in it.
      # `shasum -a 256` rather than `sha256sum`, which macOS has not got; the
      # Makefile asks which is there. See D1020.
      - name: an archive, unpacked and run
        run: |
          make release
          cd build
          shasum -a 256 -c kest-*.tar.gz.sha256
          mkdir out && tar xzf kest-*.tar.gz -C out
          cd out/kest-*
          export KEST_LIB=lib/kest/
          ./bin/kest --version
          ./bin/kest run "$GITHUB_WORKSPACE/examples/math.kest"
          printf '%s\n' '#include "kest.h"' '#include <stdio.h>' \
              'int main(void) {' \
              '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }' \
              '    printf("a host built against the archive says %s, abi %u\\n",' \
              '           kest_version(), kest_abi_version());' \
              '    return 0;' \
              '}' > host.c
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -o host host.c \
              lib/libkest.a -lm
          ./host
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: build/kest-*.tar.gz*

  # The same tree through a different compiler. Everything else on Linux is
  # gcc, and a warning one compiler makes and the other does not is a thing
  # this tree is held to having none of: `-Werror` is on in every build here,
  # so a clang that sees something gcc does not stops this job. Focused rather
  # than a second copy of the gate -- the build and `make fast` are where a
  # compiler disagreement shows, and the rest of the gate is the same source
  # running the same way. See D1020.
  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and fast, under clang
        run: |
          clang --version
          make -j CC=clang
          make fast CC=clang

  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: four machines of one build, under the thread sanitiser
        run: |
          make -j kest libkest.a
          cat > /tmp/two.kest <<'KEST'
          module two

          fn work(n: i32) -> i32 no.alloc no.host deterministic {
              let sum = 0
              for i in 0..n {
                  sum += i % 7
              }
              return sum
          }
          KEST
          cat > /tmp/two.c <<'EOF'
          // Four machines of one build, each on a thread of its own. They are
          // started here rather than in the workers: starting writes the
          // build's own stamp counter, so which thread starts a machine is the
          // host's to decide and it is this one. What runs at once is the
          // running. See D988.
          //
          // Through pthreads rather than C11's own, which is what the gate's
          // threads check uses: the thread sanitiser does not see through
          // `thrd_create` and dies in its own interceptor before anything of
          // this language has run. The threads are the harness and not the
          // language, so which of the two makes them is the harness's to pick.
          #include <stdio.h>
          #include <pthread.h>
          #include "kest.h"
          static void *turning(void *given) {
              KestRuntime *rt = given;
              KestValue frame[4] = {{0}};
              frame[0].integer = 200000;
              int32_t at = kest_entry(rt, "work");
              if (at < 0 || !kest_call(rt, at, frame, 4)) {
                  return (void *)1;
              }
              return frame[0].integer == 599994 ? NULL : (void *)1;
          }
          int main(void) {
              KestBuild *build = kest_build("/tmp/two.kest", NULL, stderr,
                                            KEST_FORM_TEXT, 0);
              if (build == NULL) { return 1; }
              KestRuntime *four[4];
              pthread_t running[4];
              for (int i = 0; i < 4; i++) {
                  four[i] = kest_start(build, NULL, NULL);
                  if (four[i] == NULL) {
                      kest_build_report(build, stderr, KEST_FORM_TEXT);
                      return 1;
                  }
              }
              for (int i = 0; i < 4; i++) {
                  if (pthread_create(&running[i], NULL, turning,
                                     four[i]) != 0) {
                      return 1;
                  }
              }
              int wrong = 0;
              for (int i = 0; i < 4; i++) {
                  void *said = NULL;
                  pthread_join(running[i], &said);
                  wrong += said != NULL ? 1 : 0;
              }
              for (int i = 0; i < 4; i++) {
                  kest_runtime_free(four[i]);
              }
              kest_build_free(build);
              if (wrong != 0) {
                  fprintf(stderr, "%d of four did not answer\n", wrong);
                  return 1;
              }
              printf("four machines of one build ran at once and agreed\n");
              return 0;
          }
          EOF
          cc -std=c11 -O1 -g -fsanitize=thread -Iinclude -o /tmp/two /tmp/two.c \
              $(ls src/*.c | grep -v main.c) -lm
          /tmp/two

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: an archive, unpacked and run
        run: |
          make -j
          make release
          cd build
          sha256sum -c kest-*.tar.gz.sha256
          mkdir out && tar xzf kest-*.tar.gz -C out
          cd out/kest-*
          export KEST_LIB=lib/kest/
          ./bin/kest --version
          ./bin/kest run "$GITHUB_WORKSPACE/examples/math.kest"
          # And a host built against the header and the library that are in
          # the archive, which is the question an archive is for. See D1000.
          printf '%s\n' '#include "kest.h"' '#include <stdio.h>' \
              'int main(void) {' \
              '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }' \
              '    printf("a host built against the archive says %s, abi %u\\n",' \
              '           kest_version(), kest_abi_version());' \
              '    return 0;' \
              '}' > host.c
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -o host host.c \
              lib/libkest.a -lm
          ./host
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86-64
          path: build/kest-*.tar.gz*

  linux-full:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because one of the checks builds the tree at
      # `v1.0.0` and compares: a shallow checkout has no tag to build, and
      # what that check does then is say so and hold nothing. See D1021.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the whole gate
        run: mkdir -p /home/runner/kest-tmp && TMPDIR=/home/runner/kest-tmp make check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build
        shell: cmd
        run: tools\build.bat
      - name: examples
        shell: bash
        run: |
          export KEST_LIB=lib/
          sh tools/conformance.sh ./build/win/kest.exe windows-x86-64.trace
          cat windows-x86-64.trace
      - name: an archive, unpacked and run
        shell: cmd
        run: tools\package.bat
      # Unpacked into a room of its own and used the way somebody who
      # downloaded it would: the binary asked what it is, a program it has
      # never seen run through it, and a host compiled against the header and
      # the library that are in the archive rather than the ones in this tree.
      # An archive nobody unpacked is a directory listing. See D1000.
      - name: what is in it, from a clean room
        shell: pwsh
        run: |
          $zip = Get-ChildItem build\kest-*-windows-x86_64.zip
          $said = Get-Content "$($zip.FullName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          if (-not $said.StartsWith($hash)) {
            throw "the checksum beside the archive is not the archive's"
          }
          Expand-Archive -Path $zip.FullName -DestinationPath out
          $root = (Get-ChildItem out -Directory)[0].FullName
          $env:KEST_LIB = "$root\lib\kest\"
          & "$root\bin\kest.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the archive's kest.exe would not run" }
          Set-Content hello.kest @(
            'import std.text', '',
            'fn main() -> i32 {',
            '    let said = text.repeat("ok", 2)',
            '    return len(said) - 4',
            '}')
          & "$root\bin\kest.exe" run hello.kest
          if ($LASTEXITCODE -ne 0) { throw "the archive would not run a program" }
          Set-Content host.c @(
            '#include "kest.h"', '#include <stdio.h>',
            'int main(void) {',
            '    if (kest_abi_version() != KEST_ABI_VERSION) { return 1; }',
            '    printf("a host built against the archive says %s, abi %u\n",',
            '           kest_version(), kest_abi_version());',
            '    return 0;',
            '}')
          cl /nologo /std:c11 /I"$root\include" host.c "$root\lib\kest.lib" /Fe:host.exe
          if ($LASTEXITCODE -ne 0) { throw "a host would not build against the archive" }
          .\host.exe
          if ($LASTEXITCODE -ne 0) { throw "a host built against the archive would not run" }
      - uses: actions/upload-artifact@v4
        with:
          name: trace-windows-x86-64
          path: windows-x86-64.trace
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86-64
          path: build/kest-*-windows-x86_64.zip*

  agree:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: trace-*, merge-multiple: true }
      - name: every platform says the same thing
        run: |
          diff -u linux-x86-64.trace windows-x86-64.trace \
            && echo "linux and windows said the same thing"
          diff -u linux-x86-64.trace macos-arm64.trace \
            && echo "linux and macos said the same thing"
