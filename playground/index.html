<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kest playground</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  header { padding: 0.8rem 1.2rem; background: #22313f; color: #fff; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header a { color: #cfe3ff; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; padding: 0.8rem; height: calc(100vh - 4rem); box-sizing: border-box; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } }
  textarea, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; padding: 0.7rem; margin: 0; box-sizing: border-box; background: #fff; }
  textarea { width: 100%; height: 100%; min-height: 20rem; resize: none; tab-size: 4; }
  pre { overflow: auto; white-space: pre-wrap; min-height: 20rem; }
  .bar { display: flex; gap: 0.5rem; align-items: center; }
  button, select { font-size: 0.95rem; padding: 0.35rem 0.8rem; border-radius: 5px; border: 1px solid #99a; background: #fff; cursor: pointer; }
  button.run { background: #2d7a46; color: #fff; border-color: #2d7a46; }
  .status { color: #cfe3ff; font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <h1>Kest</h1>
  <div class="bar">
    <select id="examples" aria-label="an example to start from"></select>
    <button class="run" id="run">Run</button>
    <button id="check">Check</button>
    <button id="format">Format</button>
  </div>
  <span class="status" id="status">loading the compiler</span>
  <a href="https://github.com/Rawframe-Project/kest">source and documents</a>
</header>
<main>
  <textarea id="program" spellcheck="false" aria-label="the program"></textarea>
  <pre id="said" aria-live="polite"></pre>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
