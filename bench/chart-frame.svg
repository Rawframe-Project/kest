<text x="28.0" y="62.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#495057" text-anchor="start">One call a frame, every body moved and bounced off the walls: 16.7 ms over what a body cost. Higher is better.</text>
