name: release

# release-please keeps a draft release pull request open from the
# conventional commits on main. Merging it tags vX.Y.Z and creates the GitHub
# release; the archives job then builds the archive for every platform at the
# tag, and the assets job adds the source archive, writes the checksums and an
# SBOM, attests where all of it was built, and attaches it to the release.
# docs/operations/release.md has the steps.

on:
  push:
    branches: [main]
  # Runs again by hand after a failed push run, without a new commit.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Both steps act with the app token, so github.token needs no permissions here.
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The Rawframe Release app's token, not github.token, so the release pull
      # request runs CI: GitHub starts no workflows for pull requests github.token opens.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release commit and tag, the
          # release pull request, and its labels.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The archive a user unpacks, built on each platform at the tag: the command
  # line, the library, the header, the standard library, the sources and the
  # VS Code extension.
  archives:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      # The tag says which version it is and the header says which version is
      # built; an archive that disagrees with its tag is refused.
      - name: The tag is the version the header says
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          built=$(sed -n 's/^#define KEST_VERSION_STRING "\(.*\)"$/\1/p' include/kest.h)
          if [ "v$built" != "$TAG" ]; then
            echo "::error::the tag is $TAG and kest.h says $built"
            exit 1
          fi
      # The release preset, packed by CPack: a .tar.gz on Linux and macOS and a
      # .zip on Windows, named for the version, system and processor.
      - name: The archive
        run: |
          cmake --preset release
          cmake --build --preset release
          # CMake's own cpack: Windows runners have a Chocolatey one first on the path.
          "$(dirname "$(command -v cmake)")/cpack" --preset release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.runner }}
          path: |
            out/release/package/kest-*.tar.gz
            out/release/package/kest-*.zip
          if-no-files-found: error

  assets:
    needs: [release-please, archives]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      # The tagged tree as well, which GitHub's own source archives are not
      # promised to keep byte-stable; this one is checksummed and attested.
      - name: The source archive
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          git archive --format=tar.gz --prefix="kest-${TAG#v}-source/" \
            -o "dist/kest-${TAG#v}-source.tar.gz" HEAD
          ls dist
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 5
      # Without a source name syft names the document after its path, ".".
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
          SYFT_SOURCE_VERSION: ${{ needs.release-please.outputs.tag }}
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
